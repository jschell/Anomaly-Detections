[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siem-anomaly"
version = "0.0.0"
description = "Provider-neutral anomaly detection and behavioral analytics for SIEM-backed Jupyter workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "jschell" }
]
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[dependency-groups]
dev = [
  "pandas-stubs>=2.2",
  "pyarrow-stubs>=20.0.0.20260819",
  "pyright>=1.1.380",
  "pytest>=8.3",
  "pytest-cov>=5",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/siem_anomaly"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
